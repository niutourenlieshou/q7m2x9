<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b6e4f">
<title>树患管控拍照</title>
<style>
  :root{--green:#0b6e4f;--green-d:#085a41;--bg:#f2f6f4;--card:#fff;--ink:#1f2937;--sub:#6b7280;--ok:#16a34a;--warn:#d97706;--err:#dc2626;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;padding:12px 14px 40px;}
  h1{font-size:20px;display:flex;align-items:center;gap:8px;}
  .status{font-size:12px;color:var(--sub);margin-top:2px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:4px;vertical-align:1px;}
  .dot.g{background:var(--ok);}.dot.y{background:var(--warn);}.dot.r{background:var(--err);}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .card h2{font-size:15px;margin-bottom:10px;color:var(--green-d);}
  .btns{display:flex;gap:10px;}
  .btn{flex:1;border:none;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:600;color:#fff;background:var(--green);cursor:pointer;}
  .btn.sec{background:#e5e7eb;color:var(--ink);}
  .btn:disabled{opacity:.45;}
  .btn.upload{background:var(--green-d);padding:16px;font-size:17px;}
  #preview{display:none;width:100%;border-radius:10px;margin-top:10px;max-height:340px;object-fit:cover;}
  #preview.show{display:block;}
  .msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px;display:none;}
  .msg.ok{display:block;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
  .msg.err{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
  .msg.warn{display:block;background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
  .small{font-size:12px;color:var(--sub);}
  details summary{cursor:pointer;color:var(--sub);font-size:13px;margin-top:10px;}
  label.t{display:block;font-size:13px;color:var(--sub);margin:8px 0 2px;}
  .inp{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px;font-size:14px;}
  #upInfo{font-size:13px;margin-top:8px;color:var(--sub);}
  progress{width:100%;height:8px;margin-top:8px;display:none;}
  #infoBox{display:none;font-size:14px;line-height:2;margin-top:10px;background:#f8faf9;border:1px solid #e5e7eb;border-radius:10px;padding:10px;}
  #infoBox.show{display:block;}
  #linkBox{display:flex;gap:6px;margin-top:4px;}
  #linkOut{flex:1;font-size:11px;}
</style>
</head>
<body>
  <h1>🌲 树患管控拍照</h1>
  <div class="status"><span class="dot" id="gpsDot"></span><span id="gpsText">正在获取定位…</span></div>

  <div class="card">
    <h2>① 拍照 / 选图</h2>
    <div class="btns">
      <button class="btn" id="btnCam">📷 拍照</button>
      <button class="btn sec" id="btnGal">🖼 从相册选</button>
    </div>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <input type="file" id="gal" accept="image/*" hidden>
    <img id="preview" alt="预览">
    <div id="infoBox">
      <b>本张照片信息</b><br>
      拍摄时间：<span id="iTime">—</span><br>
      定位来源：<span id="iSrc">—</span><br>
      GPS：<span id="iGps">—</span>
    </div>
  </div>

  <div class="card">
    <button class="btn upload" id="btnUp" disabled>⬆️ 上传（自动归档到电脑）</button>
    <progress id="pg" value="0" max="1"></progress>
    <div id="upInfo"></div>
    <div class="msg ok" id="msgOk"></div>
    <div class="msg warn" id="msgWarn"></div>
    <div class="msg err" id="msgErr"></div>
    <div class="btns" style="margin-top:10px">
      <button class="btn sec" id="btnNext" style="display:none">拍下一张</button>
    </div>
  </div>

  <details>
    <summary>设置与说明</summary>
    <p class="small">阿里云 OSS 凭据（每台手机填一次，只存本机）。</p>
    <label class="t">Bucket 名称</label>
    <input class="inp" id="setBucket" placeholder="例如 fortree">
    <label class="t">地域 Endpoint（华南深圳填 oss-cn-shenzhen）</label>
    <input class="inp" id="setRegion" placeholder="oss-cn-shenzhen">
    <label class="t">AccessKey ID</label>
    <input class="inp" id="setAk" placeholder="LTAI…">
    <label class="t">AccessKey Secret</label>
    <input class="inp" id="setSk" type="password">
    <button class="btn" id="btnSave" style="margin-top:10px">保存设置</button>
    <div class="msg ok" id="saveMsg"></div>
    <label class="t">一键配置链接（发给同事点一下即自动填好）</label>
    <div id="linkBox">
      <input class="inp" id="linkOut" readonly>
      <button class="btn sec" id="btnLink" style="flex:0 0 72px">复制</button>
    </div>
    <p class="small" style="margin-top:6px">⚠️ 链接里含密钥，请只发给本班组同事，且建议使用<b>仅上传权限</b>的专用密钥。</p>
    <p class="small" style="margin-top:10px">
      使用要点：<br>
      ① 拍照等页面显示"定位OK"再按快门（精度差会红字警告）；<br>
      ② <b>不要在微信里打开</b>（微信安卓不给网页定位），用自带浏览器/Safari，建议"添加到主屏幕"；<br>
      ③ 山里没信号也能拍——照片自带相机定位，回有网处从"相册"补传即可正确归档。<br>
      🔒 线路坐标始终只存在您的电脑上，本页面与云端不含坐标。
    </p>
  </details>

<script>
'use strict';
/*EXIF-START*/
// ---- JPEG EXIF GPS 读取（标准 JPEG APP1/EXIF 结构解析）----
function readExifGpsFromArrayBuffer(ab){
  try{
    const dv=new DataView(ab);
    if(dv.byteLength<4 || dv.getUint16(0)!==0xFFD8) return null;   // 仅JPEG
    let off=2;
    while(off+4<=dv.byteLength){
      if(dv.getUint8(off)!==0xFF){ off++; continue; }
      const m=dv.getUint8(off+1);
      if(m===0xD8||(m>=0xD0&&m<=0xD7)||m===0x01){ off+=2; continue; }
      const len=dv.getUint16(off+2);
      if(m===0xE1 && len>10){                        // APP1
        let p=off+4;
        if(dv.getUint32(p)===0x45786966 && dv.getUint8(p+4)===0){  // 'Exif\0'
          const g=parseTiffGps(dv, p+6);
          if(g) return g;
        }
      }
      off += 2+len;
    }
  }catch(e){}
  return null;
}
function parseTiffGps(dv, t){
  const le = dv.getUint16(t)===0x4949;
  const u16=(o)=>dv.getUint16(o,le), u32=(o)=>dv.getUint32(o,le);
  const TYPE_SIZE={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
  if(u16(t+2)!==0x2A) return null;
  const ifd0 = t + u32(t+4);
  const n=u16(ifd0);
  let gpsOff=null;
  for(let i=0;i<n;i++){
    const e=ifd0+2+i*12;
    if(u16(e)===0x8825){ gpsOff = u32(e+8); break; }   // GPS IFD 指针
  }
  if(gpsOff===null) return null;
  gpsOff += t;
  const ng=u16(gpsOff);
  let latRef=null,lat=[],lonRef=null,lon=[];
  for(let i=0;i<ng;i++){
    const e=gpsOff+2+i*12;
    const tag=u16(e), type=u16(e+2), cnt=u32(e+4);
    let valOff;
    // 值长度≤4字节则内联在 e+8, 否则 e+8 存的是相对TIFF头的偏移
    if((TYPE_SIZE[type]||0)*cnt<=4) valOff=e+8; else valOff=t+u32(e+8);
    if(tag===1) latRef=asciiAt(dv,valOff);
    else if(tag===2&&type===5) lat=rationals(dv,valOff,cnt,u32);
    else if(tag===3) lonRef=asciiAt(dv,valOff);
    else if(tag===4&&type===5) lon=rationals(dv,valOff,cnt,u32);
  }
  if(!latRef||!lonRef||lat.length<3||lon.length<3) return null;
  const dms=(r,ref)=>{ const d=r[0]+r[1]/60+r[2]/3600; return (ref==='S'||ref==='W')?-d:d; };
  const la=dms(lat,latRef), lo=dms(lon,lonRef);
  if(!isFinite(la)||!isFinite(lo)) return null;
  return {lat:la, lon:lo};
}
function rationals(dv,o,cnt,u32){
  const r=[];
  for(let i=0;i<cnt;i++){
    const num=u32(o+i*8), den=u32(o+i*8+4);
    r.push(den? num/den : 0);
  }
  return r;
}
function asciiAt(dv,o){
  let s='';
  for(let i=0;i<3;i++){ const c=dv.getUint8(o+i); if(c===0) break; s+=String.fromCharCode(c); }
  return s;
}
/*EXIF-END*/

let CFG=loadCfg();
let blobJpg=null, shotPos=null, gpsLatest=null, shotTime=null, confirmArmed=false;

function loadCfg(){ try{ return JSON.parse(localStorage.getItem('cfg')||'{}'); }catch(e){ return {}; } }
function saveCfg(c){ localStorage.setItem('cfg', JSON.stringify(c)); }
function fillInputs(){ setBucket.value=CFG.bucket||''; setRegion.value=CFG.region||'oss-cn-shenzhen'; setAk.value=CFG.ak||''; setSk.value=CFG.sk||''; }
(function initCfg(){
  // 支持 ?b=桶&r=地域&a=AK&s=SK 一键配置(点链接自动填好并保存)
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('b')||q.get('a')){
      CFG={bucket:q.get('b')||'', region:q.get('r')||'oss-cn-shenzhen', ak:q.get('a')||'', sk:q.get('s')||''};
      saveCfg(CFG);
      history.replaceState(null,'',location.pathname);   // 去掉地址栏里的密钥
    }
  }catch(e){}
  fillInputs();
})();
btnSave.onclick=()=>{
  CFG={bucket:setBucket.value.trim(), region:setRegion.value.trim()||'oss-cn-shenzhen', ak:setAk.value.trim(), sk:setSk.value.trim()};
  saveCfg(CFG); saveMsg.textContent='已保存 ✓'; setTimeout(()=>saveMsg.style.display='none',1500);
  buildLink(); checkReady();
};
function buildLink(){
  linkOut.value = CFG.bucket&&CFG.ak&&CFG.sk
    ? location.origin+location.pathname+'?b='+encodeURIComponent(CFG.bucket)+'&r='+encodeURIComponent(CFG.region)+'&a='+encodeURIComponent(CFG.ak)+'&s='+encodeURIComponent(CFG.sk)
    : '（先保存设置，再复制）';
}
btnLink.onclick=()=>{
  buildLink(); linkOut.select();
  try{ document.execCommand('copy'); }catch(e){}
  linkOut.value='✔ 已复制，发到班组群即可'; setTimeout(buildLink,1600);
};

/* ---- GPS ---- */
function gpsState(cls,txt){ gpsDot.className='dot '+cls; gpsText.textContent=txt; }
function startGps(){
  if(!navigator.geolocation){ gpsState('r','不支持定位(需HTTPS)'); return; }
  gpsState('y','正在定位…');
  navigator.geolocation.watchPosition(pos=>{
    gpsLatest={lat:pos.coords.latitude, lon:pos.coords.longitude, acc:Math.round(pos.coords.accuracy), ts:Date.now()};
    gpsState(pos.coords.accuracy<=40?'g':'y','定位OK 精度±'+Math.round(pos.coords.accuracy)+'米');
  }, err=>{
    gpsState('r',{1:'已拒绝定位权限(请到浏览器设置里允许)',2:'定位不可用',3:'定位超时'}[err.code]||'定位失败');
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}

/* ---- 拍照/选图 ---- */
btnCam.onclick=()=>cam.click();
btnGal.onclick=()=>gal.click();
function msgShow(el,t){ el.innerHTML=t; el.style.display='block'; }
function msgHideAll(){ ['msgOk','msgWarn','msgErr'].forEach(id=>document.getElementById(id).style.display='none'); }
async function handleFile(f){
  if(!f) return;
  msgHideAll(); confirmArmed=false;
  shotTime=new Date();
  // 1) 尝试读照片自带 EXIF 定位(相机拍照时写入) —— 无信号补传场景的关键
  const ab = await blobToArrayBuffer(f).catch(()=>null);
  const exif = ab ? readExifGpsFromArrayBuffer(ab) : null;
  // 2) 实时定位兜底
  const live = gpsLatest && (Date.now()-gpsLatest.ts<=120000) ? gpsLatest : null;
  if(exif)      shotPos={lat:exif.lat, lon:exif.lon, acc:null,  src:'相机定位(EXIF)'};
  else if(live) shotPos={lat:live.lat, lon:live.lon, acc:live.acc, src:'实时定位', stale:false};
  else if(gpsLatest) shotPos={lat:gpsLatest.lat, lon:gpsLatest.lon, acc:gpsLatest.acc, src:'实时定位(已过时)', stale:true};
  else         shotPos=null;

  blobJpg=await compress(await loadImg(f), 1920, 0.85);
  preview.src=URL.createObjectURL(blobJpg); preview.classList.add('show');
  infoBox.classList.add('show');
  iTime.textContent=fmtDT(shotTime);
  if(shotPos){
    iSrc.textContent=shotPos.src;
    iGps.textContent=Math.abs(shotPos.lat).toFixed(5)+', '+Math.abs(shotPos.lon).toFixed(5)
      +(shotPos.acc!=null?('（±'+shotPos.acc+'米）'):'');
  }else{
    iSrc.textContent='未定位'; iGps.textContent='—';
  }
  if(!shotPos)
    msgShow(msgWarn,'⚠️ 本照片<b>没有定位信息</b>：请到空旷处等页面显示"定位OK"后重拍（如用相册补传，请确认照片是<b>用手机相机拍摄</b>、且开了相机定位）。');
  else if(shotPos.stale||(shotPos.src==='实时定位'&&shotPos.acc>100))
    msgShow(msgWarn,'⚠️ 当前定位精度差(±'+shotPos.acc+'米)，归档可能不准确。<b>上传前请再次点击"上传"确认</b>，或换个开阔位置重拍。');
  checkReady();
}
function fmtDT(d){ const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function blobToArrayBuffer(blob){ return new Promise((ok,no)=>{
  const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.onerror=no; fr.readAsArrayBuffer(blob); }); }
function loadImg(f){ return new Promise((ok,no)=>{
  const rd=new FileReader();
  rd.onload=e=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=e.target.result; };
  rd.onerror=no; rd.readAsDataURL(f);
});}
function compress(img,maxDim,quality){ return new Promise(ok=>{
  const sc=Math.min(1,maxDim/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  cv.toBlob(b=>ok(b),'image/jpeg',quality);
});}
cam.onchange=e=>{ handleFile(e.target.files[0]); e.target.value=''; };
gal.onchange=e=>{ handleFile(e.target.files[0]); e.target.value=''; };

/* ---- 上传(PostObject Policy签名) ---- */
function b64FromBytes(u8){ let bin=''; const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return btoa(bin); }
function b64utf8(str){ return b64FromBytes(new TextEncoder().encode(str)); }
async function hmacSha1B64(msg){
  const key=await crypto.subtle.importKey('raw', new TextEncoder().encode(CFG.sk), {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  return b64FromBytes(new Uint8Array(await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(msg))));
}
function ossHost(){ return 'https://'+CFG.bucket+'.'+CFG.region+'.aliyuncs.com'; }
async function ossPostObject(objPath, blob){
  const exp=new Date(Date.now()+15*60*1000).toISOString().replace(/\.\d+Z$/,'Z');
  const policy=b64utf8(JSON.stringify({expiration:exp, conditions:[
    {bucket:CFG.bucket}, ['content-length-range',0,10*1024*1024], ['eq','$key',objPath]]}));
  const signature=await hmacSha1B64(policy);
  const fd=new FormData();
  fd.append('key',objPath); fd.append('policy',policy); fd.append('OSSAccessKeyId',CFG.ak);
  fd.append('signature',signature); fd.append('success_action_status','200');
  fd.append('file',blob,'photo.jpg');
  return fetch(ossHost()+'/', {method:'POST', body:fd, cache:'no-store'});
}

function checkReady(){
  btnUp.disabled=!(CFG.bucket&&CFG.ak&&CFG.sk&&blobJpg);
}
btnUp.onclick=async()=>{
  msgHideAll();
  if(!shotPos){
    msgShow(msgErr,'无法上传：本照片没有定位信息。请到空旷处重拍（实时定位）或用带相机定位的原图补传。');
    return;
  }
  // 精度差/定位过时时需要再点一次确认
  const needConfirm = shotPos.src!=='相机定位(EXIF)' && (shotPos.stale || shotPos.acc>100);
  if(needConfirm && !confirmArmed){
    confirmArmed=true;
    msgShow(msgWarn,'⚠️ 定位精度 ±'+shotPos.acc+'米，可能归错区段。确认无误请<b>再点一次"上传"</b>。');
    return;
  }
  const d=shotTime||new Date(), p=n=>String(n).padStart(2,'0');
  const ts=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  const fname = shotPos
    ? ts+'_'+Math.abs(shotPos.lat).toFixed(4)+'_'+Math.abs(shotPos.lon).toFixed(4)+'.jpg'
    : '未定位_'+ts+'.jpg';
  const objPath='待处理/'+fname;
  btnUp.disabled=true; pg.style.display='block'; pg.value=0.3; upInfo.textContent='上传中…';
  try{
    const r=await ossPostObject(objPath, blobJpg);
    pg.value=1;
    if(r.ok){
      upInfo.textContent='';
      msgShow(msgOk,'✅ 上传成功！<br>文件：<b>'+fname+'</b><br><span class="small">办公室电脑 1~2 分钟内自动下载，按杆号归入「树患照片归档」文件夹。</span>');
      btnNext.style.display='block';
    }else{
      let why='HTTP '+r.status;
      if(r.status===403) why='AccessKey 无效/无权上传，或时间偏差>15分钟';
      if(r.status===405) why='CORS 未配置 POST，见部署指南';
      if(r.status===409) why='同名文件已存在，请重拍';
      throw new Error(why);
    }
  }catch(e){
    pg.value=0; upInfo.textContent='';
    msgShow(msgErr,'❌ 上传失败：'+(/Failed to fetch|NetworkError/i.test(e.message||'')?'网络不通或CORS未配置':e.message));
    btnUp.disabled=false;
  }
};
btnNext.onclick=()=>{
  blobJpg=null; shotPos=null; confirmArmed=false;
  preview.classList.remove('show'); preview.src='';
  infoBox.classList.remove('show');
  msgHideAll(); btnNext.style.display='none'; upInfo.textContent=''; pg.style.display='none';
  checkReady();
};

startGps();
buildLink();
checkReady();
</script>
</body>
</html>
